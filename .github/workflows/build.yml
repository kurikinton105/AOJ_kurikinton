name: Build WPF

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore wpf-master/WpfApp1.sln

      - uses: microsoft/setup-msbuild@v2

      - name: Build Release
        run: msbuild wpf-master/WpfApp1.sln /m /p:Configuration=Release /p:Platform="Any CPU"
